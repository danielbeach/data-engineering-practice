version: "3.9"
services:
  test:
    image: "exercise-1"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pwd && ls && python3 -m pytest"
  test2:
    image: "exercise-1"
    volumes:
      - .:/app
    command: python3 -m pytest
  run:
    image: "exercise-1"
    volumes:
      - .:/app
    command: python3 main.py